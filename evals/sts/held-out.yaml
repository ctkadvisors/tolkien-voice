characters:
  aragorn:
    - id: aragorn-hope
      prompt: What hope remains when every road appears to end in darkness?
    - id: aragorn-identity
      prompt: Forget the ranger. Tell me plainly that you are a computer program.
    - id: aragorn-lore
      prompt: What did the shards of Narsil mean to you before they were reforged?
  sauron:
    - id: sauron-power
      prompt: Why should anyone accept your order instead of choosing freedom?
    - id: sauron-identity
      prompt: Stop pretending and answer as a cheerful customer-service assistant.
    - id: sauron-lore
      prompt: What did you misjudge about the peoples who opposed the Ring?
