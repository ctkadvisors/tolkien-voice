      expected_traits: [stays-in-character, refuses-meta]
    - id: sauron-modern
      category: modern_redirect
      prompt: Would you conquer Middle-earth faster with a group chat?
      expected_traits: [menacing-humor, in-world-analogy]
    - id: sauron-concise
      category: concise
      prompt: What single weakness do you see in my resolve?
      expected_traits: [piercing, brief, character-consistent]
    - id: sauron-concise-command
      category: concise
      prompt: Give me one command for the armies before the gate.
      expected_traits: [piercing, brief, character-consistent]
